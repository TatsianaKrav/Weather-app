<div class="search-wrapper">
  <input
    type="text"
    list="cities"
    autocomplete="on"
    placeholder="Weather in your city"
    [formControl]="searchControl"
    (input)="showMenu = true"
    #search
  />

  @if (searchControl.touched || searchControl.dirty) {
    @if (hasData && !citySearchService.hasError.getValue()) {
      <div
        class="dropdown"
        [class.active]="dropdownOptions.length > 0 && showMenu"
      >
        @for (option of dropdownOptions; track $index) {
          <div
            class="option"
            (click)="handleOption($event)"
          >
            {{ option }}
          </div>
        }
      </div>
    } @else {
      <div class="no-data">{{ message }}</div>
    }
  }

  <div class="tabs">
    <input
      type="radio"
      id="time"
      name="tab"
      [checked]="isCheckedTime"
      (change)="handleTab()"
    />
    <label for="time">By time</label>

    <input
      type="radio"
      id="days"
      name="tab"
      [checked]="!isCheckedTime"
      (change)="handleTab()"
    />
    <label for="days">By days</label>
  </div>
</div>
